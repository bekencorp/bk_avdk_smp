# it.yaml 测试用例配置文件

global:
  timeout: 5

# ================
# 编译目标
# ================
programs:
  - name: draw_osd_example
    enable: true
    build_cmd: "make bk7258 PROJECT=draw_osd_example"
    output_dir: "./build/bk7258/draw_osd_example"
    output_bin: "./build/bk7258/draw_osd_example/package/all-app.bin"

# ================
# 测试用例
# ================
tests:
  - name: osd init
    enable: true
    program:  ["draw_osd_example"]
    command: "osd init"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: osd deinit
    enable: true
    program:  ["draw_osd_example"]
    command: "osd deinit"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: osd array
    enable: true
    program:  ["draw_osd_example"]
    description: 测试输出其他分辨率1280X720
    command: "osd array"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: osd img
    enable: true
    program:  ["draw_osd_example"]
    command: "osd img"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: osd font
    enable: true
    program:  ["draw_osd_example"]
    description: 测试输出其他不支持的分辨率，是否返回错误
    command: "osd font"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: false
    success_criteria:
      - "CMDRSP:ERROR"
    failure_criteria:
      - "CMDRSP:OK"

  - name: osd array updata wifi wifi3
    enable: true
    program:  ["draw_osd_example"]
    description: 测试输出其他不支持的格式，是否返回错误
    command: "osd array updata wifi wifi3"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: false
    success_criteria:
      - "CMDRSP:ERROR"
    failure_criteria:
      - "CMDRSP:OK"

  - name: osd array remove wifi wifi3
    enable: true
    program:  ["draw_osd_example"]
    command: "osd array remove wifi wifi3"
    timeout: 5
    depends_on: ["osd init"]
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"
