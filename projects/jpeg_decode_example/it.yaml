# it.yaml 测试用例配置文件

global:
  timeout: 5

# ================
# 编译目标
# ================
programs:
  - name: jpeg_decode_example
    enable: true
    build_cmd: "make bk7258 PROJECT=jpeg_decode_example"
    output_dir: "./build/bk7258/jpeg_decode_example"
    output_bin: "./build/bk7258/jpeg_decode_example/package/all-app.bin"

# ================
# 测试用例
# ================
tests:
  # 常规测试用例
  - name: jpeg_decode_01
    enable: true
    program:  ["jpeg_decode_example"]
    command: "jpeg_decode_regular_test hardware_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: jpeg_decode_02
    enable: true
    program:  ["jpeg_decode_example"]
    command: "jpeg_decode_regular_test software_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: jpeg_decode_03
