# it.yaml 测试用例配置文件

global:
  timeout: 5

# ================
# 编译目标
# ================
programs:
  - name: uvc_example
    enable: true
    build_cmd: "make bk7258 PROJECT=uvc_example"
    output_dir: "./build/bk7258/uvc_example"
    output_bin: "./build/bk7258/uvc_example/package/all-app.bin"


# ================
# 测试用例
# ================

tests:
  - name: dvp_open_01
    enable: true
    description: 测试DVP设备打开且输出640X480 jpeg图像功能
    program:  ["dvp_example"]
    command: "dvp open"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - case_name: dvp_close_01
    enable: true  # 控制该测试用例是否启用，true为启用，false为禁用
    description: 测试DVP设备关闭功能
    program:  ["dvp_example"]
    command: "dvp close"
    timeout: 5
    depends_on: ["dvp_close_01"]
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: dvp_open_02
