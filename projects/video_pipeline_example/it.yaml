# it.yaml 测试用例配置文件

global:
  timeout: 5

# ================
# 编译目标
# ================
programs:
  - name: video_pipeline_example
    enable: true
    build_cmd: "make bk7258 PROJECT=video_pipeline_example"
    output_dir: "./build/bk7258/video_pipeline_example"
    output_bin: "./build/bk7258/video_pipeline_example/package/all-app.bin"

# ================
# 测试用例
# ================
tests:
  # 常规测试用例
  - name: video_pipeline_01
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_regular_test hardware_rotate_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: video_pipeline_02
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_regular_test software_rotate_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: video_pipeline_03
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_regular_test h264_encode_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  # 错误测试用例
  - name: video_pipeline_error_01
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_error_test null_handle_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: video_pipeline_error_02
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_error_test invalid_config_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"

  - name: video_pipeline_error_03
    enable: true
    program:  ["video_pipeline_example"]
    command: "video_pipeline_error_test no_callback_test"
    timeout: 5
    depends_on: null
    expected_success: true
    success_criteria:
      - "CMDRSP:OK"
    failure_criteria:
      - "CMDRSP:ERROR"